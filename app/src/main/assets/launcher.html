<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__home__</title>
<style>
  /* Panoramic home screen. Viewport is ~1200x500 CSS px, shown very wide in the glasses. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #14233d 0%, #0a111e 100%);
    color: #eef3ff; padding: 14px 28px 24px; overflow-y: auto;
  }
  .top { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .clockbox { min-width: 170px; }
  #clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #date { font-size: 17px; opacity: .7; margin-top: 4px; }
  form { flex: 1; display: flex; gap: 10px; }
  #q {
    flex: 1; font-size: 24px; padding: 12px 18px; border-radius: 16px; border: 2px solid #3a5a88;
    background: #0f1b30; color: #fff; outline: none;
  }
  #q:focus { border-color: #5ab0ff; }
  .btn {
    font-size: 22px; padding: 0 22px; border-radius: 16px; border: 0;
    background: #2f7fe0; color: #fff; white-space: nowrap; height: 54px;
  }
  .btn.alt { background: #26405f; }
  h2 { font-size: 22px; font-weight: 700; opacity: .85; margin: 14px 4px 10px; }
  h2 small { font-size: 15px; font-weight: 400; opacity: .7; margin-right: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
  .tile {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10);
    border-radius: 20px; padding: 14px 6px 12px; text-align: center; user-select: none;
    transition: background .12s, transform .12s;
  }
  .tile:active { background: rgba(90,176,255,.30); transform: scale(1.04); }
  .ic { height: 64px; line-height: 64px; font-size: 50px; }
  .ic img { width: 64px; height: 64px; border-radius: 14px; vertical-align: middle; }
  .lb { font-size: 19px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #empty { font-size: 18px; opacity: .6; padding: 10px 4px; }
</style>
</head>
<body>
<div class="top">
  <div class="clockbox">
    <div id="clock"></div>
    <div id="date"></div>
  </div>
  <form id="f">
    <input id="q" placeholder="חיפוש בגוגל או כתובת אתר" autocomplete="off">
    <button class="btn" type="submit">חפש</button>
  </form>
  <button class="btn alt" onclick="XR.mirror()">📱 מסך הטלפון</button>
</div>

<h2>אפליקציות <small>נפתחות בטלפון ומוצגות כאן בחלון</small></h2>
<div class="grid" id="apps"></div>
<div id="empty" style="display:none">לא נמצאו אפליקציות</div>

<h2>אתרים</h2>
<div class="grid" id="sites"></div>

<script>
  var SITES = [
    ["🔎", "Google", "https://www.google.com"],
    ["▶️", "YouTube", "https://m.youtube.com"],
    ["✉️", "Gmail", "https://mail.google.com"],
    ["📁", "Drive", "https://drive.google.com"],
    ["📅", "יומן", "https://calendar.google.com"],
    ["💬", "WhatsApp Web", "https://web.whatsapp.com"],
    ["🗺️", "מפות", "https://www.google.com/maps"],
    ["📰", "ynet", "https://www.ynet.co.il"],
    ["🎬", "Netflix", "https://www.netflix.com"],
    ["✳️", "Claude", "https://claude.ai"]
  ];
  function openUrl(url) { if (window.XR) XR.open(url); else location.href = url; }

  function tile(icon, label, onclick) {
    var d = document.createElement("div");
    d.className = "tile";
    d.innerHTML = '<div class="ic"></div><div class="lb"></div>';
    if (icon) d.querySelector(".ic").textContent = icon;
    d.querySelector(".lb").textContent = label;
    d.onclick = onclick;
    return d;
  }

  var sites = document.getElementById("sites");
  SITES.forEach(function (s) { sites.appendChild(tile(s[0], s[1], function () { openUrl(s[2]); })); });

  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault();
    var t = document.getElementById("q").value.trim();
    if (!t) return;
    var url = /^https?:\/\//.test(t) ? t
      : (t.indexOf(" ") < 0 && t.indexOf(".") > 0 ? "https://" + t
      : "https://www.google.com/search?q=" + encodeURIComponent(t));
    document.getElementById("q").value = "";
    openUrl(url);
  };

  function tick() {
    var n = new Date();
    document.getElementById("clock").textContent = n.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("date").textContent = n.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
  }
  tick(); setInterval(tick, 10000);

  function loadApps() {
    if (!window.XR) return;
    var list = [];
    try { list = JSON.parse(XR.apps()); } catch (e) {}
    var box = document.getElementById("apps");
    if (!list.length) document.getElementById("empty").style.display = "block";
    list.forEach(function (a) {
      var d = tile("", a.label, function () { XR.launch(a.pkg); });
      box.appendChild(d);
      a.el = d.querySelector(".ic");
    });
    var i = 0;
    (function next() {
      if (i >= list.length) return;
      var a = list[i++];
      var src = XR.icon(a.pkg);
      if (src) { var img = new Image(); img.src = src; a.el.appendChild(img); }
      setTimeout(next, 5);
    })();
  }
  setTimeout(loadApps, 200);
</script>
</body>
</html>
